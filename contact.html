<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <a href="index.html" class="home-button" title="Back to Home">
        <i class="fas fa-home"></i>
    </a>

    <div class="content">
        <div class="contact-grid">
            <div class="contact-info">
                <h2>Get in Touch</h2>
                <p>I'm currently open to new opportunities and collaborations. Whether you have a question or just want to say hi, feel free to reach out!</p>
                
                <div class="contact-methods">
                    <a href="mailto:your.email@example.com" class="contact-method">
                        <i class="fas fa-envelope"></i>
                        <div class="method-details">
                            <h3>Email</h3>
                            <p>your.email@example.com</p>
                        </div>
                    </a>
                    
                    <a href="https://linkedin.com/in/yourusername" class="contact-method">
                        <i class="fab fa-linkedin"></i>
                        <div class="method-details">
                            <h3>LinkedIn</h3>
                            <p>Connect with me professionally</p>
                        </div>
                    </a>
                    
                    <a href="https://github.com/yourusername" class="contact-method">
                        <i class="fab fa-github"></i>
                        <div class="method-details">
                            <h3>GitHub</h3>
                            <p>Check out my code</p>
                        </div>
                    </a>
                </div>
            </div>
            
            <div class="contact-form">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">
                        <span>Send Message</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
